# Local services for later (spec §8.5). NOT used by default: local dev and tests run on PGlite
# and the local-filesystem storage adapter (D-004, D-014). To use real Postgres:
#   docker compose up -d postgres
#   DATABASE_URL=postgres://nittcam:nittcam@localhost:5432/nittcam pnpm --filter @nittcam/db db:migrate
# MinIO is the S3-compatible store for the future S3 storage adapter (not implemented yet).
# Credentials below are local-only defaults, never used outside a developer machine.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nittcam
      POSTGRES_PASSWORD: nittcam
      POSTGRES_DB: nittcam
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nittcam -d nittcam']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Pin a release tag when the S3 adapter is implemented.
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: nittcam
      MINIO_ROOT_PASSWORD: nittcam-local
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
